# Written by `zel ci init github`. Regenerate rather than edit by hand —
# this tracks the commands it calls.
#
# Separate from your existing workflows and scoped to the documentation
# folder: a typo fix should not run your test suite, and your documentation
# should not wait for it.
name: Documentation

on:
  push:
    branches: [main]
    paths: ['examples/zellij-docs/content/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['examples/zellij-docs/content/**', '.github/workflows/docs.yml']
  # Re-deploy without a content change — after rotating a secret,
  # or to put the current `main` back up. `zel ci publish` calls this.
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  CONTENT: examples/zellij-docs/content

jobs:
  # Runs on every pull request and costs about fifteen seconds. No
  # credentials, no registry. It catches a link to a page somebody
  # deleted before review rather than after deploy.
  check:
    name: Content is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zel
        run: |
          curl -fsSL https://raw.githubusercontent.com/mylife-inc/releases/main/zellij/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: zel check "$CONTENT"

  publish:
    name: Netlify
    needs: check
    # Not `== 'push'`: that excluded workflow_dispatch, so a manual
    # run went green having deployed nothing. Everything except a
    # pull request should publish.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install zel
        run: |
          curl -fsSL https://raw.githubusercontent.com/mylife-inc/releases/main/zellij/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: zel build "$CONTENT" --out dist

      # Netlify's own uploader, until `zel deploy` lands.
      #
      # Run from outside the checkout, which matters in a workspace.
      # netlify-cli walks up from the working directory looking for
      # package.json, and when it finds a root with several packages it
      # refuses to guess which one it is deploying:
      #
      #   Error: Projects detected: @acme/docs, @acme/site, ...
      #
      # It looks at the working directory, not at --dir. So this runs
      # from $RUNNER_TEMP, where nothing walks up into a workspace, and
      # points --dir at the output where it lies.
      #
      # It does NOT move the output first, which was the previous fix and
      # failed: `zel build` writes dist from inside a container, as root,
      # and the runner user cannot unlink what root created —
      #
      #   mv: cannot move 'dist' to '/home/runner/work/_temp/site': Permission denied
      #
      # Nothing needs to move. Only the working directory mattered.
      - name: Upload
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: 91774174-d4c2-41b5-aa4b-ac61eeadbf51
        run: |
          set -eu
          # Copy, not move: `zel build` writes dist from inside a
          # container as root, and the runner cannot unlink what root
          # created. Reading it is fine.
          rm -rf "$RUNNER_TEMP/site"
          cp -r dist "$RUNNER_TEMP/site"
          # Deploy from $RUNNER_TEMP so netlify-cli finds no workspace
          # above it, with a RELATIVE --dir: an absolute one was
          # silently ignored and it published the working directory
          # instead (publishOrigin: default, publish: .../_temp).
          cd "$RUNNER_TEMP"
          npx --yes netlify-cli@latest deploy --prod --dir site
