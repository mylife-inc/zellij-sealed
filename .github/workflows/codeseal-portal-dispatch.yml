# Generated by `sgit workflows`. Mode 4 — portal-dispatch.
# Triggered by an external dispatcher (sgit ci dispatch, the Portal
# UI, or the auto-dispatch hook on `sgit push`). NEVER triggered by
# `push` events directly — the encrypted token is required.
# Requires:
#   Secrets: CODESEAL_DISPATCH_PRIVATE_KEY
name: codeseal-portal-dispatch

on:
  workflow_dispatch:
    inputs:
      encrypted_token:
        description: "age-encrypted dispatch payload (base64)"
        required: true
        type: string
      build_id:
        description: "UUID issued by the dispatcher (for audit correlation)"
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mask dispatch token
        # workflow_dispatch inputs are NOT auto-masked by GitHub.
        # This MUST be the first step; a later `echo` would leak.
        env:
          ENCRYPTED_TOKEN: ${{ inputs.encrypted_token }}
        run: echo "::add-mask::$ENCRYPTED_TOKEN"

      # Every third-party action is pinned to a commit, not a tag.
      #
      # A tag is a moving pointer its owner can repoint at any time. In an
      # ordinary repository that is a supply-chain risk; in this one it is the
      # whole threat model, because these steps run on a machine that is about
      # to hold Zellij's decrypted source. An action that changed under its tag
      # would execute beside the plaintext this repository exists to keep off
      # GitHub.
      #
      # The toolchains are also installed BEFORE the decrypt step below, so
      # that even a compromised one runs while there is nothing on disk but
      # ciphertext. Defence in depth: the pin should hold, and if it does not,
      # the ordering means there is nothing there to take.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: cli

      - name: Install sgit
        env:
          # Just the binary — no $CODESEAL home, no compose files, no deploy
          # assets. CI needs none of it.
          SGIT_ONLY: "1"
          INSTALLER: https://raw.githubusercontent.com/mylife-inc/releases/main/codeseal/install.sh
        run: |
          set -euo pipefail
          curl -fsSL "$INSTALLER" -o /tmp/install-sgit.sh
          sh /tmp/install-sgit.sh
          sgit --version

      - name: Unwrap dispatch token
        id: dispatch
        env:
          # All secrets via env, never argv.
          ENCRYPTED_TOKEN: ${{ inputs.encrypted_token }}
          CODESEAL_DISPATCH_PRIVATE_KEY: ${{ secrets.CODESEAL_DISPATCH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          BUILD_ID=$(sgit ci unwrap-dispatch-token \
            --out /tmp/codeseal-runner-key \
            --expected-repo "$GITHUB_REPOSITORY" \
            --expected-ref "$GITHUB_REF_NAME")
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "Decrypted dispatch token for build $BUILD_ID."

      - name: Load key material into env
        run: |
          set -euo pipefail
          # The runner-key file is either:
          #   passphrase mode: a single line `SGIT_KEY=...`
          #   recipient mode:  the bech32 age private key
          if head -c 9 /tmp/codeseal-runner-key | grep -q '^SGIT_KEY='; then
            # Passphrase mode: export to GITHUB_ENV.
            cat /tmp/codeseal-runner-key >> "$GITHUB_ENV"
          else
            # Recipient mode: hand the file to sgit decrypt via env.
            echo "SGIT_IDENTITY=$(cat /tmp/codeseal-runner-key)" >> "$GITHUB_ENV"
          fi

      - name: Decrypt repository
        run: sgit decrypt --force

      - name: Wipe runner key (MUST happen before build)
        run: |
          set -euo pipefail
          shred -u /tmp/codeseal-runner-key || rm -f /tmp/codeseal-runner-key
          echo "SGIT_KEY=" >> "$GITHUB_ENV"
          echo "SGIT_IDENTITY=" >> "$GITHUB_ENV"

      - name: Build
        run: bash .github/workflows/codeseal-ci.sh

      - name: Clean plaintext
        if: always()
        run: sgit clean
