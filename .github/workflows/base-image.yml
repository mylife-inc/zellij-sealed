# Publish the engine base image from the sealed repository.
#
# `zel build` starts a container from this image, so it is a primitive: every
# product's documentation pipeline depends on it, and a stale image means every
# site is generated by a stale engine whatever version of `zel` produced it.
#
# The plaintext repository builds it in `base-image.yml` on a tag. Here it is
# `workflow_dispatch` only, because the image is built from `engine/`, which is
# encrypted — a runner needs a dispatch token before it can read the source at
# all.
#
# Requires:
#   Secrets: CODESEAL_DISPATCH_PRIVATE_KEY
#   Package: mylife-inc/zellij-base must grant this repository Write under
#            "Manage Actions access". The package was created by pushes from
#            mylife-inc/Zellij, and GHCR grants push by *linked repository* —
#            so the repository-level workflow permission is necessary and on
#            its own not enough.
name: Base image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag, e.g. v0.1.3"
        required: true
        type: string
      encrypted_token:
        description: "age-encrypted dispatch payload (base64)"
        required: true
        type: string
      build_id:
        description: "UUID from the dispatcher, for audit correlation"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE: mylife-inc/zellij-base

jobs:
  build:
    name: ${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45

    # Native runners for both, so neither half is emulated.
    #
    # This is the advantage CI has over a laptop, and the reason this workflow
    # is worth having even though `scripts/publish.sh image` exists: locally,
    # arm64 means QEMU and a very long build, so the image published from a
    # developer machine is amd64-only. Here each architecture builds on its own
    # hardware.
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { arch: amd64, name: linux/amd64, runner: ubuntu-latest }
          - { arch: arm64, name: linux/arm64, runner: ubuntu-24.04-arm }

    permissions:
      contents: read
      # Declared rather than inherited. The repository default is the ceiling,
      # not the grant, and a workflow that says what it needs is one whose
      # requirements survive somebody tightening that default later.
      packages: write

    steps:
      - uses: actions/checkout@v4

      # `engine/` is ciphertext until this runs. The action destroys the key
      # material before it returns, so the build itself never holds it.
      - uses: ./.github/actions/codeseal-decrypt
        with:
          encrypted_token: ${{ inputs.encrypted_token }}
          dispatch_key: ${{ secrets.CODESEAL_DISPATCH_PRIVATE_KEY }}

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest rather than by tag, and the tags applied in `merge`.
      #
      # Two jobs pushing the same tag would race: whichever finished last would
      # win and the image would be single-architecture, silently. Digests do not
      # collide, so each job publishes its own and the manifest list is
      # assembled once both exist.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/base.Dockerfile
          platforms: ${{ matrix.platform.name }}
          build-args: ZELLIJ_FEATURES=none
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=base-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=base-${{ matrix.platform.arch }}

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    name: Publish the manifest
    needs: build
    runs-on: ubuntu-latest

    # No decryption here: this job pushes no image, it stitches two that already
    # exist into one manifest list. It never needs the source.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # How many digests arrived is the whole question. One means a manifest
      # that claims to be multi-architecture and is not, which is the failure
      # this shape exists to prevent — so it is printed rather than assumed.
      - name: What is being merged
        run: |
          set -eu
          ls -1 /tmp/digests | sed 's/^/  sha256:/'
          count=$(ls -1 /tmp/digests | wc -l)
          echo "digests: $count"
          [ "$count" -eq 2 ] || {
            echo "::error::Expected 2 digests (amd64 + arm64), found $count."
            exit 1
          }

      - name: Stitch the architectures into one manifest
        working-directory: /tmp/digests
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          # `latest` is what DEFAULT_IMAGE resolves to and what every pipeline
          # pulls; the version tag is what keeps a build reproducible after
          # `latest` has moved on.
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE}:latest" \
            --tag "${REGISTRY}/${IMAGE}:${VERSION#v}" \
            $(printf "${REGISTRY}/${IMAGE}@sha256:%s " *)

      - name: Show what was published
        env:
          VERSION: ${{ inputs.version }}
        run: docker buildx imagetools inspect "${REGISTRY}/${IMAGE}:${VERSION#v}"
