# Generated by `sgit workflows`. Do not edit — re-run the command.
#
# Installs sgit and decrypts the repository in place, then destroys the key
# material it used. Call it from any job that needs the plaintext:
#
#     - uses: actions/checkout@v4
#     - uses: ./.github/actions/codeseal-decrypt
#       with: { ... }
#
# The key is gone before this action returns, so whatever the job does next
# never has access to the material that unwrapped it.
name: CodeSeal decrypt
description: Install sgit, decrypt the repository, and destroy the key material.

inputs:
  encrypted_token:
    description: "age-encrypted dispatch payload (base64), from inputs.encrypted_token"
    required: true
  dispatch_key:
    description: "From secrets.CODESEAL_DISPATCH_PRIVATE_KEY"
    required: true

runs:
  using: composite
  steps:
    - name: Mask the dispatch token
      shell: bash
      env:
        ENCRYPTED_TOKEN: ${{ inputs.encrypted_token }}
      run: echo "::add-mask::$ENCRYPTED_TOKEN"

    - name: Install sgit
      shell: bash
      env:
        # Just the binary — no $CODESEAL home, no compose files, no deploy
        # assets. CI needs none of it.
        SGIT_ONLY: "1"
        INSTALLER: https://raw.githubusercontent.com/mylife-inc/releases/main/codeseal/install.sh
        # The installer asks the GitHub API which release is current, and the
        # anonymous API is rate-limited *by IP*. Runners share heavily-used
        # address pools, so a four-job matrix installing at once is enough:
        # one job gets through and the rest get 403 — on a public repository
        # that needs no credential to read at all.
        #
        # `github.token` is scoped to this repository and read-only here. It
        # is not in a job's environment by default, which is why it is named.
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        curl -fsSL "$INSTALLER" -o "$RUNNER_TEMP/install-sgit.sh"
        sh "$RUNNER_TEMP/install-sgit.sh"
        sgit --version

    - name: Unwrap the dispatch token
      shell: bash
      env:
        ENCRYPTED_TOKEN: ${{ inputs.encrypted_token }}
        CODESEAL_DISPATCH_PRIVATE_KEY: ${{ inputs.dispatch_key }}
      run: |
        set -euo pipefail
        BUILD_ID=$(sgit ci unwrap-dispatch-token \
          --out "$RUNNER_TEMP/codeseal-runner-key" \
          --expected-repo "$GITHUB_REPOSITORY" \
          --expected-ref "$GITHUB_REF_NAME")
        echo "Decrypted dispatch token for build $BUILD_ID."

        # Passphrase mode writes a single `SGIT_KEY=...` line; recipient mode
        # writes the bech32 private key on its own.
        if head -c 9 "$RUNNER_TEMP/codeseal-runner-key" | grep -q '^SGIT_KEY='; then
          cat "$RUNNER_TEMP/codeseal-runner-key" >> "$GITHUB_ENV"
        else
          echo "SGIT_IDENTITY=$(cat "$RUNNER_TEMP/codeseal-runner-key")" >> "$GITHUB_ENV"
        fi

    - name: Decrypt the repository
      shell: bash
      run: sgit decrypt --force

    # Before the caller's next step, always. The whole point of doing this in
    # an action rather than leaving it to each job is that no job can forget.
    - name: Destroy the key material
      shell: bash
      run: |
        set -euo pipefail
        for f in "$RUNNER_TEMP"/codeseal-*; do
          [ -e "$f" ] || continue
          # `shred` is GNU; macOS has no such thing and `rm` is what is left.
          command -v shred >/dev/null 2>&1 && shred -u "$f" || rm -f "$f"
        done
        echo "SGIT_KEY=" >> "$GITHUB_ENV"
        echo "SGIT_IDENTITY=" >> "$GITHUB_ENV"
