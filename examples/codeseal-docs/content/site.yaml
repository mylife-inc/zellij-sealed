name: CodeSeal
tagline: Source-at-rest encryption for Git.

brand:
  logo:
    # The wax seal alone, cut out of the full lockup. The lockup carries the
    # wordmark and the tagline underneath it, which at bar height would be
    # three lines of unreadable text — the bar sets the name as text beside
    # this, so the mark only has to be the mark.
    src: assets/brand/mark.png
    alt: CodeSeal
    # Taller than the 1.125rem default, which is tuned for a wordmark: letters
    # edge to edge read large at their box height, and a round mark reads small
    # at the same one.
    height: 1.75rem

# `paper` rather than `terracotta`. CodeSeal's own site is a warm cream ground
# with a deep wax red, and paper's #fdfcfa sits within a few points of its
# #faf9f5 — where terracotta's #fff8f3 is pink, and its #e86a33 accent is
# orange where the brand is oxblood.
theme: paper
mode: system
motion: subtle

home: home

siteUrl: https://codeseal.shebka.net
basePath: ""

nav:
  sticky: true
  align: left
  themeToggle: true
  # On because this site is also a Zellij demonstration. A real product site
  # would leave it off — offering visitors fourteen palettes says the design
  # was not a decision.
  themeSwitcher: true
  search: true
  transparentOverHero: true
  cta:
    - { label: Install CodeSeal, href: /guide/install, style: primary }

footer:
  columns:
    - heading: Start
      links:
        - { label: Install, href: /guide/install }
        - { label: Quickstart, href: /quickstart }
        - { label: Commands, href: /guide/commands }
    - heading: Going further
      links:
        - { label: Teams and recipients, href: /guide/teams }
        - { label: CI and CD, href: /guide/ci }
        - { label: Reference, href: /guide/reference }
    - heading: Understand
      links:
        - { label: Security model, href: /guide/security }
        - { label: FAQ, href: /guide/faq }
  legal: "© 2026 Shebka LLC"

# The exact wax red from the CodeSeal palette — hsl(354 70% 42%), which is the
# colour sampled from the seal in the logo. Paper's own #9a3412 is the right
# family and a shade too brown.
## An `accent` override belongs here, and is deliberately absent.
##
## CodeSeal's own site is a deep wax red, and pinning `accent` to #b6202f is
## how a real product site would hold its brand colour. But an override sits on
## top of the theme rather than inside it, so it wins against every entry in the
## picker: choosing Forest gave a green theme with red buttons, and the switcher
## looked broken because it was doing nothing visible.
##
## This site demonstrates Zellij, and the switcher is the demonstration. A real
## CodeSeal deployment would set the override and turn `themeSwitcher` off —
## those two choices go together, and taking one without the other is what
## produced fourteen red themes.

analytics:
  provider: none
